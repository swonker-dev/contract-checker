[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "russian-contract-checker"
version = "0.1.0"
description = "MVP for semantic review of Russian employment contracts"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "numpy>=2.3,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "pypdf>=6.12,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.7,<2",
  "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5.2,<6"]
dev = ["pytest>=7.4,<9"]

[project.scripts]
contract-checker = "contract_checker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract_checker = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
